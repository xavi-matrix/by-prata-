<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>By Prata | Consultoras</title><style>body{background:#151a18;color:#f1f5f2;font:16px Arial,sans-serif;margin:0}main{max-width:760px;margin:auto;padding:28px}section{background:#24302a;padding:22px;border-radius:14px;margin:16px 0}form,label{display:grid;gap:10px}label{margin:12px 0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #718579}input{background:#101b15;color:white}button{background:#74d7ae;color:#11291e;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}a{color:#80e3bb}p{color:#c3cec7}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #506357;text-align:left}div.scroll{overflow-x:auto}</style></head><body><main><small>BY PRATA • DESENVOLVIMENTO</small><h1>Cadastro de consultoras</h1><p>Somente administradores autorizados. Consultoras são criadas inativas e não recebem login ou acesso ao painel nesta etapa.</p><section id="acesso"><h2>Entrar</h2><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="senha" type="password" autocomplete="current-password" required></label><button id="entrar">Entrar</button></form></section><section id="painel" hidden><h2>Nova consultora</h2><form id="form"><label>Nome<input id="nome" required maxlength="100" placeholder="Nome da consultora"></label><label>Identificador exclusivo<input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="ex.: ana-silva"></label><label>WhatsApp com DDI 55 (opcional)<input id="whatsapp" inputmode="tel" placeholder="5547999999999"></label><button id="salvar">Salvar consultora inativa</button></form><h2>Consultoras cadastradas</h2><div class="scroll"><table><thead><tr><th>Nome</th><th>Identificador</th><th>Status</th></tr></thead><tbody id="lista"></tbody></table></div><p><button id="sair" type="button">Sair</button></p></section><p id="status" role="status" aria-live="polite"></p></main><script type="module">
import {criarAuthAdmin} from './auth-admin.js';
const el=id=>document.getElementById(id);let auth;
try{auth=criarAuthAdmin()}catch{el('entrar').disabled=true;el('status').textContent='Configuração indisponível.'}
async function atualizar(){const lista=await auth.listarConsultoras();el('lista').replaceChildren();for(const p of lista){const tr=document.createElement('tr');for(const v of [p.nome,p.slug,p.ativa?'Ativa':'Inativa']){const td=document.createElement('td');td.textContent=v;tr.append(td)}el('lista').append(tr)}if(!lista.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=3;td.textContent='Nenhuma consultora cadastrada.';tr.append(td);el('lista').append(tr)}}
el('login').addEventListener('submit',async e=>{e.preventDefault();el('entrar').disabled=true;el('status').textContent='Verificando acesso...';try{await auth.entrar(el('email').value.trim(),el('senha').value);el('acesso').hidden=true;el('painel').hidden=false;await atualizar();el('status').textContent='Administrador autorizado.'}catch(err){el('status').textContent=err.message}finally{el('senha').value='';el('entrar').disabled=false}});
el('form').addEventListener('submit',async e=>{e.preventDefault();el('salvar').disabled=true;el('status').textContent='Salvando...';try{const p=await auth.cadastrarConsultora({nome:el('nome').value,slug:el('slug').value,whatsapp:el('whatsapp').value});await atualizar();el('form').reset();el('status').textContent='Consultora '+p.slug+' cadastrada como inativa.'}catch(err){el('status').textContent=err.message}finally{el('salvar').disabled=false}});
el('sair').addEventListener('click',async()=>{await auth.sair();el('painel').hidden=true;el('acesso').hidden=false;el('status').textContent='Sessão encerrada.'});
</script></body></html>
